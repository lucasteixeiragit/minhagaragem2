<html lang="pt-br">

    <!--===================== HEADER ======================-->
    <header class="header">
        <div class="header__div">
            <a class="header__home" href="./index.html">

                    </svg>
                </span>
                MINHA GARAGEM - A
            </a>

            <nav class="header__nav">
                <a class="header__nav__garage" href="./index.html">Garagem</a>
                <a class="header__nav__addVeicle" href="./veiculo-novo.html">+ Adicionar Veiculo</a>
                <a class="header__nav__addVeicle" href="./termos.html">Termos</a>
                <a class="header__nav__addVeicle" href="./profile.html" id="linkPerfil" style="display:none;">Perfil</a>
                <a class="header__nav__addVeicle" href="./admin.html" id="linkAdmin" style="display:none;">Admin</a>
                <a class="header__nav__addVeicle" href="./mechanic.html" id="linkMecanica" style="display:none;">Mecânica</a>
                <a class="header__nav__addVeicle" href="./login.html" id="linkLogin">Entrar</a>
                <a class="header__nav__addVeicle" href="#" id="linkLogout" style="display:none;">Sair</a>
            </nav>
        </div>
    </header>


    <!--===================== MAIN / HOME ======================-->
    <main class="main">
        <div class="alertas__resumo" id="alertasResumo" style="display:none;"></div>

        <div class="main__content" id="garagemVazia">
            <h1 class="main__content__title">SUA GARAGEM ESTÁ VAZIA</h1>
            <p class="main__content__desc">Adicione seu primeiro veículo para começar a registrar manutenções.</p>
            <button class="main__content__button_addCar" id="btnAddVeiculo">+ Adicionar veículo</button>
        </div>

        <section class="main__garagem__cabecalho" id="garagemCabecalho" hidden>
            <div>
                <h1 class="main__garagem__titulo">GARAGEM</h1>
                <p class="main__garagem__contador" id="contadorVeiculos">0 veiculos sob controle</p>
            </div>
        </section>

        <div class="main__list" id="listaVeiculos" style="display:none;"></div> <!--main.js-->
    </main>




    <script type="module" src="./js/main.js"></script>
