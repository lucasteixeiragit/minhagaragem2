<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Manutenção — Minha Garagem</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/veiculo-novo.css">
    <link rel="stylesheet" href="./styles/manutencao-nova.css">
    <link rel="icon" type="image/png" sizes="1020x1020"  href="./assets/favicons/favicon.png">
</head>

<body>

    <!--===================== HEADER ======================-->
    <header class="header">
        <div class="header__div">
            <a class="header__home" href="./index.html">
                <span class="header__home__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </span>
                MINHA GARAGEM
            </a>

            <nav class="header__nav">
                <a class="header__nav__garage" href="./index.html">Garagem</a>
                <a class="header__nav__addVeicle" href="./veiculo-novo.html">+ Adicionar Veiculo</a>
            </nav>
        </div>
    </header>

    <!--===================== MAIN / HOME ======================-->
    <main class="main">
        <div class="form__header">
            <button class="btn__voltar" id="btnVoltar" onclick="window.location.href='./veiculo-detalhes.html'">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Voltar
            </button>
            <h1 class="form__title">NOVA MANUTENÇÃO</h1>
        </div>

        <form class="form__card" id="formNovaManutencao">
            <h2 class="form__card__subtitle">Detalhes do serviço</h2>

            <div class="form__row">
                <div class="form__field">
                    <label class="form__label" for="data">DATA *</label>
                    <input class="form__input__calendar" type="date" id="data" name="data" required>
                </div>
                <div class="form__field">
                    <label class="form__label" for="km">KM NO MOMENTO *</label>
                    <input class="form__input" type="number" id="km" name="km" placeholder="Ex.: 45000" required>
                </div>
            </div>

            <div class="form__row">
                <div class="form__field">
                    <label class="form__label" for="tipo">TIPO *</label>
                    <select class="form__input" id="tipo" name="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="Revisão">Revisão</option>
                        <option value="Troca de óleo">Troca de óleo</option>
                        <option value="Troca de pneus">Troca de pneus</option>
                        <option value="Alinhamento">Alinhamento</option>
                        <option value="Balanceamento">Balanceamento</option>
                        <option value="Freios">Freios</option>
                        <option value="Suspensão">Suspensão</option>
                        <option value="Elétrica">Elétrica</option>
                        <option value="Ar-condicionado">Ar-condicionado</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form__field">
                    <label class="form__label" for="custo">CUSTO (R$)</label>
                    <input class="form__input" type="number" id="custo" name="custo" placeholder="Ex.: 350,00" step="0.01">
                </div>
            </div>

            <div class="form__field">
                <label class="form__label" for="descricao">DESCRIÇÃO DETALHADA</label>
                <textarea class="form__textarea" id="descricao" name="descricao" rows="4" placeholder="Peças trocadas, oficina, marca do óleo, observações..."></textarea>
            </div>

            <div class="form__field">
                <label class="form__label" for="notaFiscal">NOTA FISCAL (OPCIONAL)</label>
                <div class="file__upload">
                    <input type="file" id="notaFiscal" name="notaFiscal" accept="image/*,application/pdf" style="display:none;">
                    <button type="button" class="btn__upload" id="btnUpload">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        Anexar arquivo (PDF ou imagem, máx. 5 MB)
                    </button>
                    <span class="file__name" id="fileName"></span>
                </div>
            </div>

            <div class="form__actions">
                <button class="form__cancel" type="button" id="btnCancelar">Cancelar</button>
                <button class="form__submit" type="submit">Salvar manutenção</button>
            </div>
        </form>
    </main>

    <!--===================== FOOTER ======================-->
    <script src="./js/manutencao-nova.js"></script>
    <script>
        (async function verificarSessao() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) window.location.href = '/login.html';
            } catch (e) { window.location.href = '/login.html'; }
        })();
    </script>
</body>
</html>
