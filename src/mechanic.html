<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área da Mecânica - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">🏠</span>
                Minha Garagem
            </a>
            <nav class="header__nav">
                <a href="mechanic.html">Veículos</a>
                <a href="meus-clientes.html">Meus Clientes</a>
                <a href="profile.html">Perfil</a>
                <a href="#" id="btnLogout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="mechanic-container">
        <div id="alert" class="alert alert-error"></div>

        <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: oklch(0.62 0.22 25); margin-bottom: 24px; letter-spacing: 1px;">
            Veículos Vinculados
        </h1>

        <div id="listaVeiculos"></div>
    </main>

    <script>
        // ============================================================
        // MECÂNICA - Frontend
        // ============================================================
        const alertEl = document.getElementById('alert');

        function mostrarAlerta(mensagem, tipo = 'error') {
            alertEl.textContent = mensagem;
            alertEl.className = `alert alert-${tipo} show`;
            setTimeout(() => { alertEl.className = 'alert'; }, 4000);
        }

        // Verifica autenticação e role MECANICA/ADMIN
        (async function verificarMecanica() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                if (data.user.role !== 'MECANICA' && data.user.role !== 'ADMIN') {
                    window.location.href = '/index.html';
                    return;
                }
                carregarVeiculos();
            } catch (e) {
                window.location.href = '/login.html';
            }
        })();

        // Logout
        document.getElementById('btnLogout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        async function carregarVeiculos() {
            try {
                const res = await fetch('/api/mechanic/vehicles');
                if (!res.ok) throw new Error('Falha');
                const data = await res.json();
                const container = document.getElementById('listaVeiculos');
                container.innerHTML = '';

                if (!data.veiculos || data.veiculos.length === 0) {
                    container.innerHTML = '<p style="color: oklch(0.6 0.01 280); text-align: center; padding: 40px;">Nenhum veículo vinculado à sua oficina.</p>';
                    return;
                }

                data.veiculos.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'vehicle-card';
                    card.innerHTML = `
                        <div class="vehicle-info">
                            <h3>${v.apelido || 'Veículo'}</h3>
                            <p>${v.marca || ''} ${v.modelo || ''} ${v.versao || ''} • ${v.ano || ''} • ${v.placa || 'Sem placa'}</p>
                            <p>KM atual: ${v.kmAtual || 0} km</p>
                        </div>
                        <button class="btn-primary" style="width: auto; padding: 10px 20px; margin: 0;" onclick="verDetalhes('${v._id}')">
                            Ver detalhes
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                mostrarAlerta('Erro ao carregar veículos.');
            }
        }

        window.verDetalhes = (id) => {
            window.location.href = `/veiculo-detalhes.html?id=${id}&mecanica=1`;
        };
    </script>
</body>
</html>
