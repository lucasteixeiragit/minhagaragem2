<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha - Minha Garagem</title>
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </span>
                MINHA GARAGEM
            </a>
            <nav class="header__nav">
                <a class="header__nav__addVeicle" href="register.html">Criar conta</a>

                <a class="header__nav__addVeicle" href="login.html">Realizar Login</a>
            </nav>
        </div>
    </header>

    <main class="auth__container">
        <div class="auth__card">
            <h1>Recuperar Senha</h1>
            <p class="auth__subtitle">Enviaremos um link para o seu e-mail.</p>

            <div id="alert" class="alert__box alert__error"></div>

            <form id="recPassForm">
                <div class="form__group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <button type="submit" class="btn__primary" id="btnRecPass">Enviar link de recuperação</button>

            </form>

            <div class="auth__links">
                Lembrou a senha? <a href="login.html">Entrar</a>
            </div>
        </div>
    </main>

</body>

<script type="module" src="./js/recPass.js"></script>
