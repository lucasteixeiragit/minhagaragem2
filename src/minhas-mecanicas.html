<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Mecânicas - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">🏠</span>
                Minha Garagem
            </a>
            <nav class="header__nav">
                <a href="index.html">Garagem</a>
                <a href="profile.html">Perfil</a>
                <a href="minhas-mecanicas.html">Minhas Mecânicas</a>
                <a href="#" id="btnLogout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="profile-container">
        <div id="alert" class="alert alert-error"></div>

        <div class="profile-card vinculos-section">
            <h2>Solicitar Mecânica</h2>
            <form id="formSolicitar" class="busca-form">
                <select id="selectMecanica" required>
                    <option value="">Carregando mecânicas...</option>
                </select>
                <button type="submit">Enviar solicitação</button>
            </form>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Convites recebidos</h2>
            <div id="listaConvitesRecebidos"></div>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Solicitações enviadas</h2>
            <div id="listaSolicitacoesEnviadas"></div>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Mecânicas vinculadas</h2>
            <div id="listaMecanicasAtivas"></div>
        </div>
    </main>

    <script>
        // ============================================================
        // MINHAS MECÂNICAS (CLIENTE) - Frontend
        // ============================================================
        const alertEl = document.getElementById('alert');
        let usuarioAtual = null;
        let mecanicasMap = {}; // id -> { id, nome, email }

        function mostrarAlerta(mensagem, tipo = 'error') {
            alertEl.textContent = mensagem;
            alertEl.className = `alert alert-${tipo} show`;
            setTimeout(() => { alertEl.className = 'alert'; }, 4000);
        }

        function formatarData(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleDateString('pt-BR');
        }

        // Verifica autenticação e role USER
        (async function iniciar() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                usuarioAtual = data.user;

                if (usuarioAtual.role !== 'USER') {
                    window.location.href = '/index.html';
                    return;
                }

                await carregarMecanicasPublicas();
                await carregarVinculos();
            } catch (e) {
                window.location.href = '/login.html';
            }
        })();

        document.getElementById('btnLogout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Carrega lista de mecânicas disponíveis para o <select>
        async function carregarMecanicasPublicas() {
            try {
                const res = await fetch('/api/mechanics/public');
                const data = await res.json();
                const select = document.getElementById('selectMecanica');
                select.innerHTML = '';

                if (!res.ok || !data.mecanicas || data.mecanicas.length === 0) {
                    select.innerHTML = '<option value="">Nenhuma mecânica disponível</option>';
                    mecanicasMap = {};
                    return;
                }

                mecanicasMap = {};
                data.mecanicas.forEach((m) => { mecanicasMap[m.id] = m; });

                select.innerHTML = '<option value="">Selecione uma mecânica...</option>' +
                    data.mecanicas.map((m) => `<option value="${m.id}">${m.nome} (${m.email})</option>`).join('');
            } catch (e) {
                mostrarAlerta('Erro ao carregar mecânicas disponíveis.');
            }
        }

        // Envia SOLICITACAO para a mecânica escolhida
        document.getElementById('formSolicitar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mecanicaId = document.getElementById('selectMecanica').value;
            if (!mecanicaId) {
                mostrarAlerta('Selecione uma mecânica.');
                return;
            }

            try {
                const res = await fetch('/api/vinculos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mecanicaId, tipo: 'SOLICITACAO' })
                });
                const data = await res.json();
                if (res.ok) {
                    mostrarAlerta('Solicitação enviada com sucesso!', 'success');
                    document.getElementById('formSolicitar').reset();
                    await carregarVinculos();
                } else {
                    mostrarAlerta(data.message || 'Erro ao enviar solicitação.');
                }
            } catch (e) {
                mostrarAlerta('Erro ao enviar solicitação.');
            }
        });

        // Carrega todos os vínculos do cliente e organiza em seções
        async function carregarVinculos() {
            try {
                const [resTodos, resAtivos] = await Promise.all([
                    fetch('/api/vinculos'),
                    fetch('/api/vinculos/minhas-mecanicas')
                ]);

                const dataTodos = await resTodos.json();
                const dataAtivos = await resAtivos.json();

                const vinculos = dataTodos.vinculos || [];

                // Convites recebidos: PENDENTE + tipo CONVITE (mecânica convidou o cliente)
                const convitesRecebidos = vinculos.filter((v) => v.status === 'PENDENTE' && v.tipo === 'CONVITE');

                // Solicitações enviadas pelo próprio cliente: PENDENTE + tipo SOLICITACAO
                const solicitacoesEnviadas = vinculos.filter((v) => v.status === 'PENDENTE' && v.tipo === 'SOLICITACAO');

                renderizarConvitesRecebidos(convitesRecebidos);
                renderizarSolicitacoesEnviadas(solicitacoesEnviadas);
                renderizarMecanicasAtivas(dataAtivos.mecanicas || []);
            } catch (e) {
                mostrarAlerta('Erro ao carregar vínculos.');
            }
        }

        function nomeMecanica(mecanicaId) {
            const m = mecanicasMap[mecanicaId];
            return m ? `${m.nome} (${m.email})` : 'Mecânica';
        }

        function renderizarConvitesRecebidos(lista) {
            const container = document.getElementById('listaConvitesRecebidos');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="vinculo-vazio">Nenhum convite pendente.</p>';
                return;
            }

            lista.forEach((v) => {
                const card = document.createElement('div');
                card.className = 'vinculo-card';
                card.innerHTML = `
                    <div class="vinculo-info">
                        <h3>${nomeMecanica(v.mecanicaId)}</h3>
                        <p>Convite recebido em ${formatarData(v.criadoEm)} <span class="status-badge ${v.status}">${v.status}</span></p>
                    </div>
                    <div class="vinculo-actions">
                        <button class="btn-small success" onclick="aceitarVinculo('${v._id}')">Aceitar</button>
                        <button class="btn-small danger" onclick="recusarVinculo('${v._id}')">Recusar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarSolicitacoesEnviadas(lista) {
            const container = document.getElementById('listaSolicitacoesEnviadas');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="vinculo-vazio">Nenhuma solicitação pendente.</p>';
                return;
            }

            lista.forEach((v) => {
                const card = document.createElement('div');
                card.className = 'vinculo-card';
                card.innerHTML = `
                    <div class="vinculo-info">
                        <h3>${nomeMecanica(v.mecanicaId)}</h3>
                        <p>Enviada em ${formatarData(v.criadoEm)} — aguardando aceite da mecânica <span class="status-badge ${v.status}">${v.status}</span></p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderizarMecanicasAtivas(lista) {
            const container = document.getElementById('listaMecanicasAtivas');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p class="vinculo-vazio">Você ainda não tem mecânicas vinculadas.</p>';
                return;
            }

            lista.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'vinculo-card';
                const mecanica = item.mecanica || {};
                card.innerHTML = `
                    <div class="vinculo-info">
                        <h3>${mecanica.nome || 'Mecânica'}</h3>
                        <p>${mecanica.email || ''} — vinculado desde ${formatarData(item.criadoEm)} <span class="status-badge ${item.status}">${item.status}</span></p>
                    </div>
                    <div class="vinculo-actions">
                        <button class="btn-small danger" onclick="desativarVinculo('${item.vinculoId}')">Desvincular</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.aceitarVinculo = async (vinculoId) => {
            try {
                const res = await fetch(`/api/vinculos/${vinculoId}/aceitar`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    mostrarAlerta('Convite aceito!', 'success');
                    await carregarVinculos();
                } else {
                    mostrarAlerta(data.message || 'Erro ao aceitar convite.');
                }
            } catch (e) {
                mostrarAlerta('Erro ao aceitar convite.');
            }
        };

        window.recusarVinculo = async (vinculoId) => {
            try {
                const res = await fetch(`/api/vinculos/${vinculoId}/recusar`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    mostrarAlerta('Convite recusado.', 'success');
                    await carregarVinculos();
                } else {
                    mostrarAlerta(data.message || 'Erro ao recusar convite.');
                }
            } catch (e) {
                mostrarAlerta('Erro ao recusar convite.');
            }
        };

        window.desativarVinculo = async (vinculoId) => {
            if (!confirm('Deseja realmente desvincular esta mecânica?')) return;
            try {
                const res = await fetch(`/api/vinculos/${vinculoId}/desativar`, { method: 'PATCH' });
                const data = await res.json();
                if (res.ok) {
                    mostrarAlerta('Vínculo desativado.', 'success');
                    await carregarVinculos();
                } else {
                    mostrarAlerta(data.message || 'Erro ao desativar vínculo.');
                }
            } catch (e) {
                mostrarAlerta('Erro ao desativar vínculo.');
            }
        };
    </script>
</body>
</html>
