<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Veículo — Minha Garagem</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/veiculo-detalhes.css">
    <link rel="icon" type="image/png" sizes="1020x1020"  href="./assets/favicons/favicon.png">
</head>

<body>

    <header class="header">
        <div class="header__div">
            <a class="header__home" href="./index.html">
                <span class="header__home__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </span>
                MINHA GARAGEM
            </a>

            <nav class="header__nav">
                <a class="header__nav__garage" href="./index.html">Garagem</a>
                <a class="header__nav__addVeicle" href="./veiculo-novo.html">+ Adicionar Veiculo</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="veiculo__header">
            <button class="btn__voltar" id="btnVoltar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Garagem
            </button>
        
            <div class="veiculo__resumo">
                <div class="veiculo__resumo__topo">
                    <div>
                        <p class="veiculo__marca" id="veiculoMarca"></p>
                        <h1 class="veiculo__titulo" id="veiculoTitulo"></h1>
                        <p class="veiculo__dados" id="veiculoDados"></p>
                    </div>
        
                    <div class="veiculo__acoes">
                        <button class="btn__editar" id="btnEditar">
                            Editar
                        </button>
        
                        <button class="btn__adicionar" id="btnAdicionarManutencao">
                            + Nova manutenção
                        </button>
                    </div>
                </div>
        
                <div class="veiculo__metricas">
                    <div class="veiculo__metrica">
                        <span class="veiculo__metrica__label">KM ESTIMADO HOJE</span>
                        <strong class="veiculo__metrica__valor" id="kmEstimado"></strong>
                    </div>
        
                    <div class="veiculo__metrica">
                        <span class="veiculo__metrica__label">MÉDIA MENSAL</span>
                        <strong class="veiculo__metrica__valor" id="kmMensal"></strong>
                    </div>
        
                    <div class="veiculo__metrica">
                        <span class="veiculo__metrica__label">MANUTENÇÕES</span>
                        <strong class="veiculo__metrica__valor" id="totalManutencoes"></strong>
                    </div>
        
                    <div class="veiculo__metrica">
                        <span class="veiculo__metrica__label">TOTAL INVESTIDO</span>
                        <strong class="veiculo__metrica__valor" id="totalInvestido"></strong>
                    </div>
                </div>
            </div>
        </div>

        <section class="proxima__revisao" id="proximaRevisao" style="display: none;">
            <div class="proxima__revisao__titulo">
                <span class="proxima__revisao__icone"></span>
                
                <h2>PROXIMA REVISÃO</h2>

                <span class="proxima__revisao__status" id="proximaRevisaoStatus">Em dia</span>
            </div>

            <p class="proxima__revisao__mensagem" id="proximaRevisaoMensagem"></p>
            <p class="proxima__revisao__detalhes" id="proximaRevisaoDetalhes"></p>

        </section>

        <div class="alertas__section" id="alertasSection" style="display:none;">
            <h2 class="alertas__titulo">⚠️ Manutenções Preventivas</h2>
            <div class="alertas__lista" id="alertasLista"></div>
        </div>

        <div class="manutencoes__section">
            <div class="manutencoes__header">
                <h2 class="manutencoes__titulo">Manutenções Realizadas</h2>
                <!-- <button class="btn__adicionar" id="btnAdicionarManutencao">+ Nova Manutenção</button> -->
            </div>

            <div class="manutencoes__vazio" id="manutencoesVazio" style="display:none;">
                <p>Nenhuma manutenção registrada ainda.</p>
                <p>Adicione a primeira manutenção para começar o histórico.</p>
            </div>

            <div class="manutencoes__lista" id="manutencoesLista"></div> <!-- veiculo.detalhes.js, class em veiculo.detalhes.css-->
        </div>
    </main>

    <script type="module" src="./js/veiculo-detalhes.js"></script>
    <!-- Guarda de sessão movida para session-guard.js. Mantida comentada para referência. -->
    <!-- <script>
        (async function verificarSessao() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) window.location.href = '/login.html';
            } catch (e) { window.location.href = '/login.html'; }
        })();
    </script> -->
    <script type="module" src="./js/session-guard.js"></script>
</body>
</html>
