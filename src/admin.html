<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">🏠</span>
                Minha Garagem
            </a>
            <nav class="header__nav">
                <a href="index.html">Garagem</a>
                <a href="profile.html">Perfil</a>
                <a href="#" id="btnLogout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="admin__container">
        <div id="alert" class="alert__box alert__error"></div>

        <div class="admin__tabs">
            <button class="admin__tab admin__tab--active" data-tab="users">Usuários</button>
            <button class="admin__tab" data-tab="vehicles">Veículos</button>
            <button class="admin__tab" data-tab="appointments">Atendimentos</button>
            <button class="admin__tab" data-tab="logs">Auditoria</button>
        </div>

        <!-- ==================== USUÁRIOS ==================== -->
        <div class="admin__panel admin__panel--active" id="panel-users">
            <div class="profile__card" style="margin-bottom: 20px;">
                <h2>Criar Usuário</h2>
                <form id="formCriarUsuario" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 12px; align-items: end;">
                    <div class="form__group" style="margin: 0;">
                        <label>Nome</label>
                        <input type="text" id="novoNome" required minlength="2">
                    </div>
                    <div class="form__group" style="margin: 0;">
                        <label>E-mail</label>
                        <input type="email" id="novoEmail" required>
                    </div>
                    <div class="form__group" style="margin: 0;">
                        <label>Senha</label>
                        <input type="password" id="novaSenha" required minlength="8">
                    </div>
                    <div class="form__group" style="margin: 0;">
                        <label>Role</label>
                        <select id="novaRole">
                            <option value="USER">USER</option>
                            <option value="MECANICA">MECANICA</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                    <button type="submit" class="btn__primary" style="margin: 0; width: auto; padding: 12px 20px;">Criar</button>
                </form>
            </div>

            <table class="admin__table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyUsuarios"></tbody>
            </table>
        </div>

        <!-- ==================== VEÍCULOS ==================== -->
        <div class="admin__panel" id="panel-vehicles">
            <table class="admin__table">
                <thead>
                    <tr>
                        <th>Apelido</th>
                        <th>Marca/Modelo</th>
                        <th>Placa</th>
                        <th>KM</th>
                        <th>Proprietário</th>
                    </tr>
                </thead>
                <tbody id="tbodyVeiculos"></tbody>
            </table>
        </div>

        <!-- ==================== ATENDIMENTOS ==================== -->
        <div class="admin__panel" id="panel-appointments">
            <div class="profile__card" style="margin-bottom: 20px;">
                <h2>Novo Atendimento</h2>
                <form id="formAtendimento" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end;">
                    <div class="form__group" style="margin: 0;">
                        <label>Mecânica</label>
                        <select id="selectMecanica"></select>
                    </div>
                    <div class="form__group" style="margin: 0;">
                        <label>Veículo</label>
                        <select id="selectVeiculo"></select>
                    </div>
                    <button type="submit" class="btn__primary" style="margin: 0; width: auto; padding: 12px 20px;">Vincular</button>
                </form>
            </div>

            <table class="admin__table">
                <thead>
                    <tr>
                        <th>Mecânica</th>
                        <th>Veículo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyAtendimentos"></tbody>
            </table>
        </div>

        <!-- ==================== AUDITORIA ==================== -->
        <div class="admin__panel" id="panel-logs">
            <table class="admin__table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Ação</th>
                        <th>Recurso</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody id="tbodyLogs"></tbody>
            </table>
        </div>
    </main>
