<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">🏠</span>
                Minha Garagem
            </a>
            <nav class="header__nav">
                <a href="register.html">Criar conta</a>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Bem-vindo de volta</h1>
            <p class="subtitle">Entre para gerenciar sua garagem</p>

            <div id="alert" class="alert alert-error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
            </form>

            <div class="auth-links">
                Não tem uma conta? <a href="register.html">Cadastre-se</a>
            </div>
        </div>
    </main>

    <script>
        // ============================================================
        // LOGIN - Frontend
        // ============================================================
        // Se já estiver autenticado, redireciona para a home
        (async function verificarSessao() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    redirecionarPorRole(data.user.role);
                }
            } catch (e) { /* sem sessão, mostra login */ }
        })();

        function redirecionarPorRole(role) {
            if (role === 'ADMIN') window.location.href = '/admin.html';
            else if (role === 'MECANICA') window.location.href = '/mechanic.html';
            else window.location.href = '/index.html';
        }

        const form = document.getElementById('loginForm');
        const alertEl = document.getElementById('alert');
        const btnLogin = document.getElementById('btnLogin');

        function mostrarAlerta(mensagem, tipo = 'error') {
            alertEl.textContent = mensagem;
            alertEl.className = `alert alert-${tipo} show`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.disabled = true;
            btnLogin.textContent = 'Entrando...';

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarAlerta(data.message || 'Erro ao fazer login.');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Entrar';
                    return;
                }

                mostrarAlerta('Login realizado! Redirecionando...', 'success');
                setTimeout(() => redirecionarPorRole(data.user.role), 800);
            } catch (err) {
                mostrarAlerta('Erro de conexão. Tente novamente.');
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
