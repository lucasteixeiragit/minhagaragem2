<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </span>
                MINHA GARAGEM
            </a>
            <nav class="header__nav">
                <a class="header__nav__addVeicle" href="login.html">Já tenho conta</a>
            </nav>
        </div>
    </header>

    <main class="auth__container">
        <div class="auth__card">
            <h1>Criar conta</h1>
            <p class="auth__subtitle">Comece a gerenciar seus veículos</p>

            <div id="alert" class="alert__box alert__error"></div>

            <form id="registerForm">
                <div class="form__group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required minlength="2" autocomplete="name">
                </div>

                <div class="form__group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="form__group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
                </div>

                <div class="form__group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required minlength="8" autocomplete="new-password">
                </div>

                <button type="submit" class="btn__primary" id="btnRegister">Criar conta</button>
            </form>

            <div class="auth__links">
                Já tem uma conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </main>

    <script type="module" src="./js/register.js"></script>
</body>
</html>
