    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Clientes - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
        <div class="header__div">
            <a href="/" class="header__home">
                <span class="header__home__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </span>
                MINHA GARAGEM
            </a>
            <nav class="header__nav">
                <a href="mechanic.html">Veículos</a>
                <a href="meus-clientes.html">Meus Clientes</a>
                <a href="profile.html">Perfil</a>
                <a href="#" id="btnLogout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="mechanic-container">
        <div id="alert" class="alert alert-error"></div>

        <div class="profile-card vinculos-section">
            <h2>Convidar Cliente</h2>
            <form id="formConvidar" class="busca-form">
                <input type="email" id="emailCliente" placeholder="E-mail do cliente" required>
                <button type="submit">Enviar convite</button>
            </form>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Solicitações recebidas</h2>
            <div id="listaSolicitacoesRecebidas"></div>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Convites enviados</h2>
            <div id="listaConvitesEnviados"></div>
        </div>

        <div class="profile-card vinculos-section">
            <h2>Clientes vinculados</h2>
            <div id="listaClientesAtivos"></div>
        </div>
    </main>
