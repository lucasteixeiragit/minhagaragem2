<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Minha Garagem</title>
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="assets/favicons/favicon.png">
</head>
<body>
    <header class="header">
            <div class="header__div">
                <a class="header__home" href="./index.html">
                    <span class="header__home__icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                        </svg>
                    </span>
                    MINHA GARAGEM
                </a>
                
            <nav class="header__nav">
                <a class="header__nav__garage" href="index.html">Garagem</a>
                <a class="header__nav__addVeicle" href="./veiculo-novo.html">+ Adicionar Veiculo</a>
                <a class="header__nav__addVeicle" href="./termos.html">Termos</a>
                <a class="header__nav__addVeicle" href="profile.html">Perfil</a>
                <a class="header__nav__addVeicle" href="#" id="linkVinculos" style="display:none;">Vínculos</a>
                <a class="header__nav__addVeicle" href="#" id="btnLogout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="profile-container">
        <div id="alert" class="alert alert-error"></div>

        <div class="profile-card">
            <h2>Meu Perfil</h2>
            <div class="profile-info">
                <div class="info-item">
                    <div class="label">Nome</div>
                    <div class="value" id="nomeUsuario">-</div>
                </div>
                <div class="info-item">
                    <div class="label">E-mail</div>
                    <div class="value" id="emailUsuario">-</div>
                </div>
                <div class="info-item">
                    <div class="label">Tipo de conta</div>
                    <div class="value"><span class="role-badge" id="roleUsuario">-</span></div>
                </div>
                <div class="info-item">
                    <div class="label">Membro desde</div>
                    <div class="value" id="criadoEm">-</div>
                </div>
            </div>
        </div>

        <div class="profile-card">
            <h2>Alterar Nome</h2>
            <form id="formNome">
                <div class="form-group">
                    <label for="novoNome">Novo nome</label>
                    <input type="text" id="novoNome" placeholder="Seu novo nome" required minlength="2">
                </div>
                <button type="submit" class="btn-primary">Salvar nome</button>
            </form>
        </div>

        <div class="profile-card">
            <h2>Alterar Senha</h2>
            <form id="formSenha">
                <div class="form-group">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmarNovaSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmarNovaSenha" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Alterar senha</button>
            </form>
        </div>
    </main>

    <script type="module" src="./js/profile.js"></script>
</body>
</html>
