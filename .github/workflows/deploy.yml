name: Deploy para Oracle

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Sincronizar arquivos no servidor (rsync)
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete --exclude=node_modules --exclude=.env --exclude=.git --exclude=.abacusai
          path: ./
          remote_path: /home/ubuntu/minhagaragem
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Instalar dependencias e reiniciar servico
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/minhagaragem
            npm install --omit=dev
            sudo systemctl restart minhagaragem
